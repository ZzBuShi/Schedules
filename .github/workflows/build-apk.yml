name: build-apk.yml
on: workflow_dispatch
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Khóa ký (tạo một lần, giữ nguyên để cập nhật ứng dụng không mất dữ liệu)
        run: |
          if [ ! -f nholam.jks ]; then
            keytool -genkeypair -keystore nholam.jks -storetype JKS -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=NhoLam"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add nholam.jks
            git commit -m "Them khoa ky"
            git push
          fi
          mkdir -p ~/.android
          cp nholam.jks ~/.android/debug.keystore
      - name: Tạo dự án Android
        run: |
          mkdir -p www
          cp schedules.html www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/local-notifications@6
          npx cap init "Nho va Lam" com.nhutthanh.nholam --web-dir www
          npx cap add android
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><uses-permission android:name="android.permission.USE_EXACT_ALARM"/><uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/><uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/><uses-permission android:name="android.permission.VIBRATE"/><application#' android/app/src/main/AndroidManifest.xml
          grep -c "USE_EXACT_ALARM" android/app/src/main/AndroidManifest.xml
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Đăng APK lên Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NhoVaLam.apk
          gh release create "apk-${{ github.run_number }}" NhoVaLam.apk --title "Nho va Lam (lan build ${{ github.run_number }})" --notes "Tải file NhoVaLam.apk về điện thoại rồi cài đặt."
