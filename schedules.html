<script>

/* ---------- parse "mai 9h họp" ---------- */
function parse(t){let d="",tm="",en="",m;const now=new Date(),off=n=>{const x=new Date(now);x.setDate(x.getDate()+n);return ymd(x)};
 if(/hôm nay/i.test(t)){d=off(0);t=t.replace(/hôm nay/i,"")}
 else if(/ngày kia/i.test(t)){d=off(2);t=t.replace(/ngày kia/i,"")}
 else if(/(ngày mai|\bmai\b)/i.test(t)){d=off(1);t=t.replace(/ngày mai|\bmai\b/i,"")}
 if(m=t.match(/(\d{1,2})\s?(?:h|giờ|:)\s?(\d{2})?\s?(?:-|đến|tới)\s?(\d{1,2})\s?(?:h|giờ|:)?\s?(\d{2})?/i)){tm=pad(+m[1])+":"+pad(+(m[2]||0));en=pad(+m[3])+":"+pad(+(m[4]||0));t=t.replace(m[0],"");if(!d)d=off(0)}else if(m=t.match(/(\d{1,2})\s?(?:h|giờ|:)\s?(\d{2})?/i)){tm=pad(+m[1])+":"+pad(+(m[2]||0));t=t.replace(m[0],"");if(!d)d=off(0)}
 return{title:t.replace(/\s+/g," ").trim(),date:d,time:tm,end:en}}

function addTask(o){const due=o.date?o.date+"T"+(o.time||"09:00"):"";let end="";if(o.end&&due){end=o.date+"T"+o.end;if(end<=due){const e=new Date(end);e.setDate(e.getDate()+1);end=ymd(e)+"T"+o.end}}
 const t={id:uid(),title:o.title,due,end,go:Math.max(0,+o.go||0),back:Math.max(0,+o.back||0),pri:+o.pri||1,rep:o.rep||"",remind:+o.remind||0,done:false,snz:0,fired:false,alertAt:0};
 t.alertAt=due?new Date(due).getTime()-t.remind*60000:0;armAlerts(t);S.tasks.push(t);save()}

function complete(t){if(t.done){t.done=false;t.doneAt=0}else{t.done=true;t.doneAt=Date.now();
 if(t.rep&&t.due){const d=new Date(t.due);t.rep==="daily"?d.setDate(d.getDate()+1):d.setDate(d.getDate()+7);
  const n={...t,id:uid(),done:false,doneAt:0,snz:0,fired:false,startedAt:0,late:0,worked:0,due:ymd(d)+"T"+pad(d.getHours())+":"+pad(d.getMinutes())};
  n.alertAt=new Date(n.due).getTime()-n.remind*60000;if(t.end){const e=new Date(new Date(t.end).getTime()+(d-new Date(t.due)));n.end=ymd(e)+"T"+pad(e.getHours())+":"+pad(e.getMinutes())}S.tasks.push(n)}
  if(t.end){const nw=Date.now(),du=new Date(t.due).getTime();if(nw<new Date(t.end).getTime()){if(nw<du){t.end=t.due;t.go=0;t.back=0}else{const e=new Date(nw);t.end=ymd(e)+"T"+pad(e.getHours())+":"+pad(e.getMinutes())}}}}
 save()}

/* ---------- reminders ---------- */
let ac;function beep(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();[0,.22].forEach(o=>{const s=ac.createOscillator(),g=ac.createGain();s.frequency.value=o?988:784;g.gain.value=.15;s.connect(g);g.connect(ac.destination);s.start(ac.currentTime+o);s.stop(ac.currentTime+o+.18)})}catch(e){}}
function toast(t){const el=document.createElement("div");el.className="toast";
 el.innerHTML=`<b>⏰ ${esc(t.title)}</b><div class="sub" style="color:inherit;opacity:.75">${t.remind?"Sắp đến hạn":"Đến giờ rồi"} · ${t.due.slice(11)}</div><div class="row"><button data-a="done">Xong rồi</button><button data-a="snz">Nhắc lại sau 10 phút</button><button data-a="x">Đóng</button></div>`;
 el.onclick=e=>{const a=e.target.dataset.a;if(!a)return;if(a==="done")complete(t);if(a==="snz")snooze(t,10);el.remove();render()};
 $("#toasts").append(el);try{navigator.vibrate&&navigator.vibrate([300,150,300,150,300])}catch(e){}}
function snooze(t,min){if(t.id==="x")return;t.snz++;S.snz++;t.fired=false;t.alertAt=Date.now()+min*60000;save()}
/* ---------- bản Android (APK): nhắc bằng báo thức hệ thống, chạy cả khi không có mạng và khi đã đóng ứng dụng ---------- */
const NATIVE=!!(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()),LN=NATIVE?Capacitor.Plugins.LocalNotifications:null;
let lnSt="",lnBusy=false,lnAgain=false;
const nid=s=>{let h=7;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)%2147483000+1};
async function lnSync(){if(!LN)return;if(lnBusy){lnAgain=true;return}lnBusy=true;
 try{const p=await LN.getPending();if(p.notifications.length)await LN.cancel({notifications:p.notifications});
  const n=Date.now(),L=[],add=(t,k,at,r)=>L.push({at,n:{id:nid(t.id+k),title:(k==="s"?"⏰ Bắt đầu: ":"⏰ Kết thúc: ")+t.title,body:r,schedule:{at:new Date(at),allowWhileIdle:true},channelId:"nhac"}});
  S.tasks.forEach(t=>{if(t.done||!t.due)return;const a=new Date(t.due).getTime(),e=t.end?new Date(t.end).getTime():0,r=t.due.slice(11)+(e?"–"+t.end.slice(11):"");
   if(a>n&&!t.startedAt)add(t,"s",a,r);if(e>n)add(t,"e",e,r)});
  L.sort((x,y)=>x.at-y.at);if(L.length)await LN.schedule({notifications:L.slice(0,60).map(x=>x.n)})}catch(e){lnSt="Lỗi: "+String(e.message||e).slice(0,80)}
 lnBusy=false;if(lnAgain){lnAgain=false;lnSync()}}
async function lnInit(){if(!LN)return;
 try{let p=await LN.checkPermissions();if(p.display!=="granted")p=await LN.requestPermissions();
  await LN.createChannel({id:"nhac",name:"Nhắc việc",description:"Nhắc khi đến giờ bắt đầu hoặc kết thúc",importance:5,visibility:1,vibration:true});
  lnSt=p.display==="granted"?"Đã bật":"Chưa được cấp quyền thông báo (vào Cài đặt điện thoại, mục Ứng dụng, để bật)";await lnSync()}catch(e){lnSt="Lỗi: "+String(e.message||e).slice(0,80)}
 render()}
async function lnTest(){try{await LN.schedule({notifications:[{id:1,title:"⏰ Thông báo thử",body:"Nếu thấy dòng này là thông báo đã hoạt động.",schedule:{at:new Date(Date.now()+5000),allowWhileIdle:true},channelId:"nhac"}]});lnSt="Đã hẹn thông báo thử sau 5 giây. Hãy thoát ra màn hình chính để xem."}catch(e){lnSt="Lỗi: "+String(e.message||e).slice(0,80)}render()}
/* ---------- máy chủ nhắc việc (Web Push, Cloudflare) ---------- */
const ub64=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")),c=>c.charCodeAt(0));
async function syncSrv(){const u=(S.srv||"").trim().replace(/\/+$/,"");if(!u)return"";
 try{if(!("Notification"in window)||Notification.permission!=="granted")return"Hãy bấm “Bật thông báo” trước.";
  const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(!reg)return"Chưa có sw.js (trang cần chạy bằng https).";

  if(!sub){const k=(await(await fetch(u+"/key")).json()).key;sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:ub64(k)})}

  const n=Date.now(),items=[];
  S.tasks.forEach(t=>{if(t.done||!t.due)return;const a=new Date(t.due).getTime(),e=t.end?new Date(t.end).getTime():0,r=t.due.slice(11)+(e?"–"+t.end.slice(11):"");
   if(a>n&&!t.startedAt)items.push({t:t.title,k:"s",at:a,r,tag:t.id+"s"});if(e>n)items.push({t:t.title,k:"e",at:e,r,tag:t.id+"e"})});
  await fetch(u+"/sync",{method:"POST",headers:{"content-type":"text/plain"},body:JSON.stringify({sub:sub.toJSON(),items})});
  return"Đã kết nối. Đã gửi "+items.length+" mốc nhắc lên máy chủ."}catch(e){return"Lỗi: "+String(e.message||e).slice(0,90)}}
/* ---------- nhắc khi đến giờ bắt đầu / kết thúc (không tính giờ đi, về) ---------- */
const WIN=30*6e4;
function armAlerts(t){const n=Date.now(),a=t.due?new Date(t.due).getTime():0,e=t.end?new Date(t.end).getTime():0;t.nS=a&&a<=n?a:0;t.nE=e&&e<=n?e:0}
function tit(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume();
 const s=ac.createOscillator(),g=ac.createGain(),t0=ac.currentTime;s.type="sine";s.frequency.value=1318;
 g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.5,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+.3);
 s.connect(g);g.connect(ac.destination);s.start(t0);s.stop(t0+.32)}catch(e){}}
function unlockAudio(){try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();if(ac.state!=="running")ac.resume()}catch(e){}}
["pointerdown","touchend","keydown","click"].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));
const ICON=(()=>{try{return document.querySelector('link[rel="apple-touch-icon"]').href}catch(e){return""}})();

 const o={body,tag,renotify:true,requireInteraction:true,vibrate:[250,120,250]};if(ICON){o.icon=ICON;o.badge=ICON}
 let reg=null;try{if(navigator.serviceWorker)reg=await navigator.serviceWorker.getRegistration()}catch(e){}
 if(reg&&reg.showNotification){await reg.showNotification(title,o);return}
 new Notification(title,o)}catch(e){}}
function aToast(t,k,late){const el=document.createElement("div");el.className="toast";
 const rg=t.due.slice(11)+(t.end?"–"+t.end.slice(11):""),lt=late>=12e4?" · trễ "+Math.floor(late/6e4)+" phút":"";
 const btn=k==="s"?(t.end?`<button data-a="st">Xác nhận đang làm</button>`:`<button data-a="done">Xong rồi</button>`):`<button data-a="done">Đã hoàn thành</button>`;
 el.innerHTML=`<div class="sub" style="color:inherit;opacity:.75">⏰ ${k==="s"?"Đến giờ bắt đầu":"Đã hết giờ"}${lt}</div><b>${esc(t.title)}</b><div class="sub" style="color:inherit;opacity:.75">${rg}</div><div class="row">${btn}<button data-a="x">Đóng</button></div>`;
 el.onclick=e=>{const a=e.target.dataset.a;if(!a)return;
  if(a==="done")complete(t);
  if(a==="st"&&!t.startedAt){t.startedAt=Date.now();t.late=Math.max(0,Math.floor((t.startedAt-new Date(t.due).getTime())/6e4));save()}
  el.remove();render()};
 $("#toasts").append(el);try{navigator.vibrate&&navigator.vibrate([300,150,300])}catch(e){}
 sysNotify((k==="s"?"⏰ Bắt đầu: ":"⏰ Kết thúc: ")+t.title,rg+lt,t.id+k)}
function alertTick(n){let any=false;
 S.tasks.forEach(t=>{if(t.done||!t.due)return;
  if(t.nS===undefined||t.nE===undefined){armAlerts(t);return}
  const a=new Date(t.due).getTime(),e=t.end?new Date(t.end).getTime():0,over=e&&n>=e;
  if(n>=a&&t.nS!==a){t.nS=a;if(!over&&!t.startedAt&&n-a<WIN){any=true;aToast(t,"s",n-a)}}
  if(e&&n>=e&&t.nE!==e){t.nE=e;if(n-e<WIN){any=true;aToast(t,"e",n-e)}}});

 return`<div class="card"><h2>Thời gian trống · ${DOW[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}</h2>
 <div style="position:relative;height:10px;background:var(--line);border-radius:9px;overflow:hidden;margin:4px 0 10px">${gaps.map(g=>`<span style="position:absolute;top:0;bottom:0;left:${(g[0]-A)/(B-A)*100}%;width:${(g[1]-g[0])/(B-A)*100}%;background:var(--ok)"></span>`).join("")}</div>
 ${gaps.length?`<div class="sub" style="margin-bottom:6px">Tổng còn trống ${dur(total)}${isToday&&from>A?" (tính từ bây giờ)":""}</div>`+gaps.map(g=>`<div class="task" style="padding:8px 0"><div class="tt">${tm(g[0])} – ${tm(g[1])}</div><div class="meta" style="margin:0 0 0 auto"><span style="color:var(--ok);font-weight:700">${dur(g[1]-g[0])}</span><button class="btn ghost sm" data-a="gapadd" data-s="${tm(g[0])}" data-e="${tm(Math.min(g[1],1439))}">+ Thêm việc</button></div></div>`).join(""):`<div class="empty">${isToday&&from>=B?"Hôm nay đã hết khung giờ.":"Không còn khoảng trống nào trong khung giờ này."}</div>`}
 <div class="row" style="align-items:center"><span class="sub" style="flex:none;min-width:0">Khung giờ tính</span><select id="ws" aria-label="Giờ bắt đầu khung">${opts(0,23,W.s)}</select><select id="we" aria-label="Giờ kết thúc khung">${opts(1,24,W.e)}</select></div>
 </div>`}

function vNotes(){const L=S.notes.filter(n=>n.t.toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(b.pin|0)-(a.pin|0)||b.at-a.at);
 return`<div class="card"><h2>Ghi chú mới</h2><textarea id="nn" rows="3" placeholder="Ý tưởng, việc cần nhớ, thứ vừa nghe được…"></textarea><div class="row"><button class="btn" data-a="nadd">Lưu ghi chú</button></div></div>
 <input id="ns" placeholder="Tìm trong ghi chú" value="${esc(q)}" aria-label="Tìm ghi chú">
 ${L.map(n=>`<div class="note ${n.pin?"pin":""}" data-nid="${n.id}"><div class="nb" contenteditable="plaintext-only" data-a="ned">${esc(n.t)}</div><div class="meta"><span>${new Date(n.at).toLocaleDateString("vi-VN")}</span><span class="acts" style="margin-left:auto"><button class="btn ghost sm" data-a="npin">${n.pin?"Bỏ ghim":"Ghim"}</button><button class="btn ghost sm" data-a="nto">Thành việc</button><button class="btn ghost sm" data-a="ndel">Xóa</button></span></div></div>`).join("")||`<div class="empty">Chưa có ghi chú nào.</div>`}`}

function lateCard(){const lim=Date.now()-7*864e5,L=S.tasks.filter(t=>t.startedAt&&t.startedAt>lim).sort((a,b)=>b.startedAt-a.startedAt),late=L.filter(t=>t.late>0),sum=late.reduce((x,t)=>x+t.late,0);
 return`<div class="card"><h2>Bắt đầu đúng giờ (7 ngày)</h2>${L.length?`<div class="sub">Đúng giờ ${L.length-late.length}/${L.length} việc · tổng trễ ${sum} phút</div>`+late.slice(0,8).map(t=>`<div class="task" style="padding:8px 0"><div class="tt">${esc(t.title)}</div><div class="meta" style="margin:0 0 0 auto"><span>${new Date(t.startedAt).toLocaleDateString("vi-VN")}</span><span class="late">trễ ${t.late}p</span></div></div>`).join(""):`<div class="empty">Chưa có việc nào được xác nhận bắt đầu.</div>`}</div>`}

function vStats(){const T=S.tasks,days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-6+i);return d});
 const done=T.filter(t=>t.done&&t.doneAt),per=days.map(d=>done.filter(t=>ymd(new Date(t.doneAt))===ymd(d)).length),mx=Math.max(1,...per);
 let streak=0;for(let i=0;i<60;i++){const d=new Date();d.setDate(d.getDate()-i);const has=done.some(t=>ymd(new Date(t.doneAt))===ymd(d));if(has)streak++;else if(i>0)break;else continue}
 const wd=done.filter(t=>t.due),ont=wd.filter(t=>t.doneAt<=new Date(t.due).getTime()+6e4).length,rate=wd.length?Math.round(ont/wd.length*100):0;
 const hrs={};done.forEach(t=>{const h=new Date(t.doneAt).getHours();hrs[h]=(hrs[h]||0)+1});const best=Object.keys(hrs).sort((a,b)=>hrs[b]-hrs[a])[0];
 const late=T.filter(t=>!t.done&&t.due&&new Date(t.due)<new Date()).length,stuck=T.filter(t=>!t.done&&t.snz>=2).length;
 let tipx=late?`Bạn đang có ${late} việc quá hạn. Xử lý việc nhỏ nhất trước để lấy đà.`:stuck?`Có ${stuck} việc bị hoãn từ 2 lần. Hãy chia nhỏ hoặc xóa bớt.`:`Mọi thứ đang ổn. Giữ nhịp này nhé.`;
 return`<div class="card"><h2>Gợi ý cho bạn</h2><div>${tipx}</div></div><div class="chips"><div class="chip ok"><b>${streak}</b>Ngày liên tiếp có việc xong</div><div class="chip"><b>${wd.length?rate+"%":"–"}</b>Xong đúng hạn</div><div class="chip"><b>${S.snz}</b>Lần bấm hoãn</div></div>
 ${lateCard()}<div class="card"><h2>Việc hoàn thành 7 ngày qua</h2><div class="bars">${per.map((v,i)=>`<div><span style="height:${v/mx*80}px"></span>${v}<br>${DOW[days[i].getDay()]}</div>`).join("")}</div><p class="tip">${best!==undefined?`Bạn hay hoàn thành việc nhất vào khoảng ${best} giờ. Đặt việc khó vào giờ này.`:"Hoàn thành vài việc để thấy giờ làm việc hiệu quả nhất của bạn."}</p></div>
 ${notifCard()}<div class="card"><h2>Sao lưu dữ liệu</h2><textarea id="bk" rows="4">${esc(JSON.stringify(S))}</textarea><div class="row"><button class="btn ghost" data-a="rest">Khôi phục từ ô trên</button></div></div>`}

function render(){const act=document.activeElement&&document.activeElement.id;
 $("#date").textContent=new Date().toLocaleDateString("vi-VN",{weekday:"long",day:"numeric",month:"long"});
 $("#nav").innerHTML=TABS.map(([k,v])=>`<button data-tab="${k}" class="${k===tab?"on":""}">${v}</button>`).join("");
 $("#main").innerHTML=(fwNote?`<div class="banner"><span>${esc(fwNote)}</span><button data-a="fwok">Ok</button></div>`:"")+(S.fs?fwCard():"")+{today:vToday,all:vAll,cal:vCal,notes:vNotes,stats:vStats}[tab]();pre=null;
 if(act==="ns"){const e=$("#ns");e.focus();e.setSelectionRange(q.length,q.length)}}

/* ---------- events ---------- */
document.addEventListener("click",e=>{const tb=e.target.closest("[data-tab]");if(tb){tab=tb.dataset.tab;render();return}
 const b=e.target.closest("[data-a]");if(!b||b.closest(".toast"))return;const a=b.dataset.a,id=b.closest("[data-id]")?.dataset.id,t=S.tasks.find(x=>x.id===id);
 if(a==="edit"&&t){editId=t.id;render()}
 else if(a==="ecancel"){editId="";render()}
 else if(a==="esave"&&t){const ti=$("#et").value.trim(),d=$("#ed").value,s=$("#es").value,en=$("#ee").value;if(ti)t.title=ti;t.go=Math.max(0,+$("#eg").value||0);t.back=Math.max(0,+$("#eb").value||0);
  if(d){t.due=d+"T"+(s||"09:00");t.end="";if(en){let e=d+"T"+en;if(e<=t.due){const x=new Date(e);x.setDate(x.getDate()+1);e=ymd(x)+"T"+en}t.end=e}}else{t.due="";t.end=""}
  t.fired=false;t.alertAt=t.due?new Date(t.due).getTime()-t.remind*60000:0;armAlerts(t);editId="";save();render()}
 else if(a==="tg"&&t){const nw=Date.now(),lv=!t.done&&t.end&&nw>=new Date(t.due)&&nw<new Date(t.end);complete(t);if(lv)fwNote="Đã hoàn thành “"+t.title+"”. Thời gian còn lại của việc này đã chuyển thành giờ rảnh"+(t.back?", tính sau khi về ("+t.back+" phút)":"")+".";render()}
 else if(a==="del"&&t){S.tasks=S.tasks.filter(x=>x!==t);save();render()}
 else if(a==="p1"&&t){const d=new Date(t.due||new Date());d.setDate(d.getDate()+1);t.due=ymd(d)+"T"+(t.due?t.due.slice(11):"09:00");if(t.end){const e=new Date(t.end);e.setDate(e.getDate()+1);t.end=ymd(e)+t.end.slice(10)}t.snz++;S.snz++;t.fired=false;t.alertAt=new Date(t.due).getTime()-t.remind*60000;armAlerts(t);save();render()}
 else if(a==="test"){if(NATIVE){lnTest();return}const n=new Date(),t={id:"x",title:"Thông báo thử",due:ymd(n)+"T"+pad(n.getHours())+":"+pad(n.getMinutes()),end:ymd(n)+"T"+pad(n.getHours())+":"+pad(n.getMinutes())};aToast(t,"e",0);tit()}
 else if(a==="srv"){S.srv=$("#srv").value.trim();save();srvSt="Đang kết nối…";render();syncSrv().then(m=>{srvSt=m||"Đã xóa địa chỉ máy chủ.";render()})}
 else if(a==="wake"){S.wake=b.checked;save();S.wake?wakeOn():wakeOff()}
 else if(a==="perm"){try{Notification.requestPermission().then(render)}catch(x){render()}}
 else if(a==="add")doAdd();
 else if(a==="st"&&t){if(!t.startedAt){t.startedAt=Date.now();t.late=Math.max(0,Math.floor((t.startedAt-new Date(t.due).getTime())/60000));save()}render()}
 else if(a==="trsave"){const g=Math.max(0,+$("#qg").value||0),bk=Math.max(0,+$("#qb").value||0);if(!g&&!bk){alert("Nhập thời gian đi hoặc về trước rồi mới lưu mẫu.");return}const nm=prompt("Đặt tên mẫu (ví dụ: Trường)");if(!nm||!nm.trim())return;TR().push({name:nm.trim().slice(0,30),go:g,back:bk});save();$("#qtr").innerHTML=trOpts();$("#qtr").value=String(TR().length-1)}
 else if(a==="trdel"){const i=$("#qtr").value;if(i===""||!TR()[+i])return;if(!confirm("Xóa mẫu “"+TR()[+i].name+"”?"))return;TR().splice(+i,1);save();$("#qtr").innerHTML=trOpts()}
 else if(a==="fw"&&t){startFree(t)}
 else if(a==="fwgo"){startFree(S.tasks.find(x=>x.id===$("#fws").value))}
 else if(a==="fwstop"){stopFree()}
 else if(a==="fwok"){fwNote="";render()}
 else if(a==="gapadd"){pre={d:selDay,s:b.dataset.s,e:b.dataset.e};tab="today";render();window.scrollTo(0,0)}
 else if(a==="day"){selDay=b.dataset.k;render()}
 else if(a==="pm"){calM=new Date(calM.getFullYear(),calM.getMonth()-1,1);render()}
 else if(a==="nm"){calM=new Date(calM.getFullYear(),calM.getMonth()+1,1);render()}
 else if(a==="nadd"){const v=$("#nn").value.trim();if(v){S.notes.push({id:uid(),t:v,at:Date.now(),pin:0});save();render()}}
 else if(a.startsWith("n")&&a!=="ned"){const n=S.notes.find(x=>x.id===b.closest("[data-nid]").dataset.nid);if(!n)return;
  if(a==="npin")n.pin=n.pin?0:1;if(a==="ndel")S.notes=S.notes.filter(x=>x!==n);if(a==="nto"){addTask({title:n.t.split("\n")[0].slice(0,120)});tab="today"}save();render()}
 else if(a==="rest"){try{const o=JSON.parse($("#bk").value);if(o&&Array.isArray(o.tasks)){S=Object.assign({tasks:[],notes:[],focus:{},snz:0},o);save();render()}}catch(x){alert("Dữ liệu không hợp lệ. Hãy dán đúng đoạn đã sao lưu.")}}});
function doAdd(){const p=parse($("#qa").value);if(!p.title)return $("#qa").focus();
 const o={title:p.title,date:$("#qd").value||p.date,time:$("#qt").value||p.time,end:$("#qe").value||p.end,pri:$("#qp").value,rep:$("#qr").value,remind:0,go:$("#qg").value,back:$("#qb").value},c=clash(o);if(c&&!confirm("Trùng giờ với “"+c.title+"” ("+when(c)+"). Vẫn thêm?"))return;addTask(o);render();$("#qa").focus()}
document.addEventListener("keydown",e=>{if(e.key==="Enter"&&e.target.id==="qa")doAdd()});
document.addEventListener("input",e=>{if(e.target.id==="ns"){q=e.target.value;render()}});
document.addEventListener("focusout",e=>{if(e.target.dataset&&e.target.dataset.a==="ned"){const n=S.notes.find(x=>x.id===e.target.closest("[data-nid]").dataset.nid);if(n){n.t=e.target.innerText;save()}}});
document.addEventListener("change",e=>{if(e.target.id==="qtr"){const x=TR()[+e.target.value];$("#qg").value=x?x.go:"";$("#qb").value=x?x.back:""}if(e.target.id==="ws"||e.target.id==="we"){const w=Object.assign({s:6,e:22},S.win);w[e.target.id==="ws"?"s":"e"]=+e.target.value;if(w.s<w.e){S.win=w;save()}render()}});
$("#theme").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
document.addEventListener("visibilitychange",()=>{if(!document.hidden){unlockAudio();wakeOn();tick();render();save()}});wakeOn();setTimeout(()=>save(),3000);if(NATIVE)lnInit();
render();
</script></body></html>
